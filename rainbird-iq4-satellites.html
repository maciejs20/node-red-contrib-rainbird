<script type="text/javascript">
	RED.nodes.registerType("rainbird-iq4-satellites", {

		color: "#FDF0C2",
		defaults: {
			name: { value: "" },
			server: { value: "", type: "rainbird-iq4-server" },

<script type="text/html" data-help-name="rainbird-iq4-satellites">
