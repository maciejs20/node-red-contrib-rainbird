<script type="text/javascript">
	RED.nodes.registerType("rainbird-iq4-flow", {
		category: "rainbird",
		color: "#FDF0C2",
		defaults: {
			name: { value: "" },
			server: { value: "", type: "rainbird-iq4-server" },
		},
		inputs: 1,
		outputs: 1,
		icon: "font-awesome/fa-tint",
		label: function () {
			return this.name || "rainbird-iq4-flow";
		},
	});
</script>

<script type="text/html" data-template-name="rainbird-iq4-flow">
	<div class="form-row">
		<label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-input-name" placeholder="Name" />
	</div>
	<div class="form-row">
		<label for="node-input-server"><i class="fa fa-cloud"></i> Server</label>
		<input type="text" id="node-input-server" placeholder="IQ4 server" />
	</div>
</script>

<script type="text/html" data-help-name="rainbird-iq4-flow">
	<p>Reads flow monitoring data from the <b>Rain Bird IQ4 cloud</b>.</p>
	<p>Optionally override the controller with <code>msg.satelliteId</code>;
	otherwise the config node's Satellite ID is used.</p>
	<p>Output <code>msg.payload</code>:</p>
	<ul>
		<li><code>flowMonitoring</code> – flow monitoring configuration/status</li>
		<li><code>flowElements</code> – flow zones/elements tree</li>
	</ul>
</script>
